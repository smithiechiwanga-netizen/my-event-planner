
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Event Planner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#080b12;
  --panel:#111827;
  --blue:#0a84ff;
  --white:#fff;
  --muted:#9ca3af;
  --border:#263244;
  --red:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:var(--blue);color:white;font-weight:bold}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea{width:100%;padding:12px;background:#080f1c;color:white;border:1px solid var(--border);border-radius:8px;margin-top:7px}
textarea{resize:vertical;min-height:75px}
label{display:block;font-size:13px;color:#cbd5e1;margin-top:13px}
header{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:19px;font-weight:bold}
.logo span{color:var(--blue)}
main{max-width:1100px;margin:auto;padding:20px}
.panel{background:var(--panel);border:1px solid var(--border);padding:18px;border-radius:13px;margin-bottom:18px}
h2{font-size:19px;margin:0 0 15px}
h3{font-size:16px}
.muted{color:var(--muted);font-size:13px}
#login{max-width:420px;margin:70px auto;padding:25px}
#login h1{font-size:27px}
#login button{width:100%;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--border);padding:16px;border-radius:12px}
.stat strong{display:block;font-size:26px;margin-top:8px;color:var(--blue)}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.secondary{background:#263244}
.danger{background:#b91c1c}
.event{padding:14px 0;border-bottom:1px solid var(--border)}
.event:last-child{border-bottom:0}
.event h3{margin:0 0 6px}
.event p{margin:5px 0;color:var(--muted);font-size:13px;white-space:pre-wrap}
.event-actions{display:flex;gap:7px;margin-top:10px}
.event-actions button{padding:7px 11px;font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{flex:1;min-width:160px;margin:0}
.toolbar select{background:#080f1c;color:white;border:1px solid var(--border);border-radius:8px;padding:10px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day-name{text-align:center;color:var(--muted);font-size:12px;padding:7px 0}
.day{min-height:65px;background:#080f1c;border:1px solid var(--border);border-radius:7px;padding:6px;font-size:12px}
.day.today{border:1px solid var(--blue)}
.day.has-event{background:#102b49}
.day small{display:block;color:#60a5fa;overflow:hidden;margin-top:5px}
.hidden{display:none!important}
#message{margin-top:12px;color:#fca5a5;font-size:13px}
@media(max-width:700px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .columns{grid-template-columns:1fr}
 main{padding:13px}
 header{padding:14px}
 .day{min-height:53px;padding:4px;font-size:11px}
 .day small{font-size:9px}
}
</style>
</head>
<body>

<header>
  <div class="logo">MY <span>EVENT</span> PLANNER</div>
  <button id="logoutBtn" class="secondary hidden" onclick="logout()">Log out</button>
</header>

<main>
  <section id="login" class="panel">
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your events.</p>
    <label>Email address</label>
    <input id="email" type="email" placeholder="Enter your email">
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter your password">
    <button id="loginBtn" onclick="login()">Sign in</button>
    <div id="message"></div>
  </section>

  <section id="dashboard" class="hidden">
    <h2>Your Dashboard</h2>
    <p class="muted" id="welcome"></p>

    <div class="stats">
      <div class="stat">Total events<strong id="total">0</strong></div>
      <div class="stat">Upcoming<strong id="upcoming">0</strong></div>
      <div class="stat">Today<strong id="todayCount">0</strong></div>
      <div class="stat">Completed<strong id="completed">0</strong></div>
    </div>

    <div class="columns">
      <section class="panel">
        <h2 id="formHeading">Create an event</h2>
        <form id="eventForm">
          <input type="hidden" id="eventId">
          <label>Event title *</label>
          <input id="title" required maxlength="150" placeholder="e.g. Birthday celebration">
          <label>Location</label>
          <input id="location" placeholder="Event location">
          <label>Event date *</label>
          <input id="eventDate" type="date" required>
          <label>Event time</label>
          <input id="eventTime" type="time">
          <label>Description</label>
          <textarea id="description" placeholder="Additional details"></textarea>
          <div class="actions">
            <button type="submit" id="saveBtn">Save event</button>
            <button type="button" class="secondary hidden" id="cancelEdit" onclick="resetForm()">Cancel</button>
          </div>
          <div id="formMessage" class="muted"></div>
        </form>
      </section>

      <section class="panel">
        <h2>Next event</h2>
        <div id="nextEvent" class="muted">No upcoming events.</div>
        <hr style="border-color:var(--border);margin:20px 0">
        <h2>Upcoming events</h2>
        <div id="upcomingList"></div>
      </section>
    </div>

    <section class="panel">
      <h2>All Events</h2>
      <div class="toolbar">
        <input id="search" placeholder="Search events..." oninput="renderEvents()">
        <select id="filter" onchange="renderEvents()">
          <option value="all">All events</option>
          <option value="upcoming">Upcoming</option>
          <option value="completed">Completed</option>
          <option value="today">Today</option>
        </select>
      </div>
      <div id="eventList"></div>
    </section>

    <section class="panel">
      <div class="calendar-head">
        <button class="secondary" onclick="changeMonth(-1)">Previous</button>
        <h2 id="monthTitle" style="margin:0"></h2>
        <button class="secondary" onclick="changeMonth(1)">Next</button>
      </div>
      <div class="calendar" id="calendar"></div>
    </section>

    <p class="muted">My Event Planner · Your personal event management space.</p>
  </section>
</main>

<script>
const SUPABASE_URL = "https://zcqikcidnucylhqpwdvk.supabase.co";
const SUPABASE_KEY = "sb_publishable_9ZLSGg4HxeUTgq1HG99hAQ_3npfjw0R";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let events = [];
let currentMonth = new Date();

const $ = id => document.getElementById(id);

function localDate(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function showMessage(id, message) {
  $(id).textContent = message;
}

async function login() {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) {
    showMessage("message","Enter your email and password.");
    return;
  }

  $("loginBtn").disabled = true;
  showMessage("message","Signing in...");

  const {error} = await db.auth.signInWithPassword({email,password});

  $("loginBtn").disabled = false;
  if (error) showMessage("message",error.message);
}

async function logout() {
  await db.auth.signOut();
}

async function handleAuth(session) {
  $("login").classList.toggle("hidden",!!session);
  $("dashboard").classList.toggle("hidden",!session);
  $("logoutBtn").classList.toggle("hidden",!session);

  if (session) {
    $("welcome").textContent = "Signed in as " + session.user.email;
    await loadEvents();
  } else {
    events = [];
    $("password").value = "";
  }
}

db.auth.onAuthStateChange((event,session) => {
  setTimeout(() => handleAuth(session),0);
});

async function loadEvents() {
  const {data,error} = await db.from("events")
    .select("*")
    .order("event_date",{ascending:true})
    .order("event_time",{ascending:true});

  if (error) {
    alert("Could not load events: " + error.message);
    return;
  }

  events = data || [];
  renderAll();
}

function isToday(e) {
  return e.event_date === localDate();
}

function isCompleted(e) {
  return e.event_date < localDate();
}

function renderAll() {
  const upcoming = events.filter(e => e.event_date >= localDate());
  const completed = events.filter(isCompleted);
  const today = events.filter(isToday);

  $("total").textContent = events.length;
  $("upcoming").textContent = upcoming.length;
  $("todayCount").textContent = today.length;
  $("completed").textContent = completed.length;

  const next = upcoming[0];
  $("nextEvent").innerHTML = next
    ? `<h3>${escapeHTML(next.title)}</h3>
       <p>${escapeHTML(next.event_date)} ${escapeHTML(next.event_time || "")}</p>
       <p>${escapeHTML(next.location || "")}</p>`
    : "No upcoming events.";

  $("upcomingList").innerHTML = upcoming.slice(0,5).map(e =>
    `<div class="event">
      <strong>${escapeHTML(e.title)}</strong>
      <p>${escapeHTML(e.event_date)} ${escapeHTML(e.event_time || "")}</p>
    </div>`
  ).join("") || '<p class="muted">No upcoming events.</p>';

  renderEvents();
  renderCalendar();
}

function renderEvents() {
  const search = $("search").value.toLowerCase().trim();
  const filter = $("filter").value;

  const filtered = events.filter(e => {
    const matches = [e.title,e.location,e.description]
      .some(v => (v || "").toLowerCase().includes(search));

    const status =
      filter === "all" ||
      (filter === "today" && isToday(e)) ||
      (filter === "upcoming" && e.event_date >= localDate()) ||
      (filter === "completed" && isCompleted(e));

    return matches && status;
  });

  $("eventList").innerHTML = filtered.map(e => `
    <div class="event">
      <h3>${escapeHTML(e.title)}</h3>
      <p>Date: ${escapeHTML(e.event_date)} ${escapeHTML(e.event_time || "")}</p>
      <p>Location: ${escapeHTML(e.location || "Not specified")}</p>
      <p>${escapeHTML(e.description || "")}</p>
      <div class="event-actions">
        <button class="secondary" onclick="editEvent('${e.id}')">Edit</button>
        <button class="danger" onclick="deleteEvent('${e.id}')">Delete</button>
      </div>
    </div>
  `).join("") || '<p class="muted">No events found.</p>';
}

$("eventForm").addEventListener("submit",async e => {
  e.preventDefault();

  const id = $("eventId").value;
  const eventData = {
    title:$("title").value.trim(),
    location:$("location").value.trim(),
    event_date:$("eventDate").value,
    event_time:$("eventTime").value || null,
    description:$("description").value.trim()
  };

  if (!eventData.title || !eventData.event_date) {
    showMessage("formMessage","Please complete the required fields.");
    return;
  }

  $("saveBtn").disabled = true;
  showMessage("formMessage","Saving...");

  let result;
  if (id) {
    result = await db.from("events").update(eventData).eq("id",id);
  } else {
    result = await db.from("events").insert(eventData);
  }

  $("saveBtn").disabled = false;

  if (result.error) {
    showMessage("formMessage",result.error.message);
    return;
  }

  resetForm();
  showMessage("formMessage","Event saved successfully.");
  await loadEvents();
});

function editEvent(id) {
  const e = events.find(item => item.id === id);
  if (!e) return;

  $("eventId").value = e.id;
  $("title").value = e.title || "";
  $("location").value = e.location || "";
  $("eventDate").value = e.event_date || "";
  $("eventTime").value = e.event_time || "";
  $("description").value = e.description || "";

  $("formHeading").textContent = "Edit event";
  $("saveBtn").textContent = "Update event";
  $("cancelEdit").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm() {
  $("eventForm").reset();
  $("eventId").value = "";
  $("formHeading").textContent = "Create an event";
  $("saveBtn").textContent = "Save event";
  $("cancelEdit").classList.add("hidden");
}

async function deleteEvent(id) {
  if (!confirm("Are you sure you want to delete this event?")) return;

  const {error} = await db.from("events").delete().eq("id",id);
  if (error) {
    alert("Could not delete event: " + error.message);
    return;
  }
  await loadEvents();
}

function changeMonth(amount) {
  currentMonth.setMonth(currentMonth.getMonth()+amount);
  renderCalendar();
}

function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();

  $("monthTitle").textContent =
    currentMonth.toLocaleDateString("en",{month:"long",year:"numeric"});

  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();

  let html = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
    .map(d => `<div class="day-name">${d}</div>`).join("");

  for(let i=0;i<firstDay;i++) html += '<div></div>';

  for(let day=1;day<=daysInMonth;day++) {
    const date = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const dayEvents = events.filter(e => e.event_date === date);
    const todayClass = date === localDate() ? "today" : "";
    const eventClass = dayEvents.length ? "has-event" : "";

    html += `<div class="day ${todayClass} ${eventClass}">
      ${day}
      ${dayEvents.slice(0,2).map(e =>
        `<small>${escapeHTML(e.title)}</small>`
      ).join("")}
      ${dayEvents.length>2 ? `<small>+${dayEvents.length-2} more</small>` : ""}
    </div>`;
  }

  $("calendar").innerHTML = html;
}

(async function start() {
  const {data:{session}} = await db.auth.getSession();
  await handleAuth(session);
})();
</script>
</body>
</html>
